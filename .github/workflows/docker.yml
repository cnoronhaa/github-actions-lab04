name: Lint e build Docker

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci

      - name: Lint
        id: lint-step
        run: npm run lint
      - name: check-lint
        if: failure() && steps.lint-step.outcome == 'failure'
        run: echo "Código precisa ser revisto."
  build_docker:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build da imagem Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: webacademy-lab04:ci
      - name: Testar contêiner por HTTP
        run: |
          container_id=$(docker run --rm -d -p 127.0.0.1:8080:8080 webacademy-lab04:ci)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          response=$(curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 http://127.0.0.1:8080/)
          printf '%s\n' "$response"
          test "$response" = 'Bem vindos ao WebAcademy!!'
      - name: Login no Docker Hub
        id: dockerhub
        if: vars.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publicar imagem no Docker Hub
        if: steps.dockerhub.outcome == 'success'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          image="$DOCKERHUB_USERNAME/webacademy-lab04"
          docker tag webacademy-lab04:ci "$image:$GITHUB_SHA"
          docker tag webacademy-lab04:ci "$image:latest"
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"
